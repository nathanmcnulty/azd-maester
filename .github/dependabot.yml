version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /container-app-job
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      container-image:
        patterns:
          - "*"
