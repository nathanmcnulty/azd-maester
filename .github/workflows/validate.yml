name: Validate solutions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      - name: Run repository tests
        run: Invoke-Pester -Path ./tests,./automation-account/tests,./container-app-job/tests,./function-app/tests,./azure-devops/tests -CI
      - name: Compile all four solution templates
        run: |
          az bicep install --version v0.46.1
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned Bicep CLI.' }
          foreach ($file in @(
            'automation-account/infra/main.bicep',
            'container-app-job/infra/main.bicep',
            'function-app/infra/main.bicep',
            'azure-devops/infra/main.bicep'
          )) {
            az bicep build --file $file --stdout | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Bicep build failed: $file" }
          }
      - name: Parse PowerShell
        run: |
          $errors = @()
          Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $errors += @($fileErrors)
          }
          if ($errors.Count) { throw ($errors | Out-String) }
